# Local / UAT stack: PostgreSQL + the application.
# Secrets come from a .env file next to this compose file (see .env.example) — never commit it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wakeel
      POSTGRES_USER: wakeel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wakeel -d wakeel"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "tsx", "scripts/migrate.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://wakeel:${POSTGRES_PASSWORD}@db:5432/wakeel
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wakeel:${POSTGRES_PASSWORD}@db:5432/wakeel
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
