name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wakeel
          POSTGRES_PASSWORD: wakeel_ci_pw
          POSTGRES_DB: wakeel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wakeel" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://wakeel:wakeel_ci_pw@localhost:5432/wakeel_test
      E2E_DATABASE_URL: postgres://wakeel:wakeel_ci_pw@localhost:5432/wakeel_e2e
      DATABASE_URL: postgres://wakeel:wakeel_ci_pw@localhost:5432/wakeel_e2e
      # CI-only throwaway keys (never used outside CI)
      DATA_ENCRYPTION_KEY: Q0ktT05MWS1ub3QtYS1yZWFsLWtleS0wMDAwMDAwMDA=
      DATA_HASH_KEY: Q0ktT05MWS1ub3QtYS1yZWFsLWhhc2gtMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: PGPASSWORD=wakeel_ci_pw psql -h localhost -U wakeel -d wakeel_test -c "create database wakeel_e2e"
      - run: npm run build
        env:
          APP_URL: http://localhost:3100
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
